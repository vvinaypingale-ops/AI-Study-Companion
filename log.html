<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EduMind Pro — Student Login & Profile Setup</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15), transparent 40%),
                #0b0f19;
    color: #f1f5f9;
    padding: 20px;
}

.auth-card {
    width: 100%;
    max-width: 480px;
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 35px 30px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    position: relative;
    overflow: hidden;
}

.auth-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
}

.brand-header {
    text-align: center;
    margin-bottom: 25px;
}

.brand-icon {
    font-size: 38px;
    display: inline-block;
    filter: drop-shadow(0 4px 10px rgba(99, 102, 241, 0.4));
    margin-bottom: 8px;
}

.brand-header h1 {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-header p {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 4px;
}

.tab-container {
    display: flex;
    background: rgba(15, 23, 42, 0.6);
    padding: 4px;
    border-radius: 12px;
    margin-bottom: 22px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

.tab-btn {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 9px;
    background: transparent;
    color: #94a3b8;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
}

.tab-btn.active {
    background: #6366f1;
    color: #ffffff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
}

.form-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
}

.input-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-bottom: 14px;
}

.input-box.full {
    margin-bottom: 14px;
}

label {
    font-size: 12px;
    font-weight: 500;
    color: #cbd5e1;
    margin-bottom: 6px;
    display: flex;
    justify-content: space-between;
}

input, select {
    width: 100%;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(15, 23, 42, 0.7);
    color: #f8fafc;
    font-size: 13px;
    outline: none;
    transition: all 0.2s ease;
}

input:focus, select:focus {
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
}

input::placeholder {
    color: #64748b;
}

select option {
    background: #1e293b;
    color: #f8fafc;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s ease;
    margin-top: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.35);
}

.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(99, 102, 241, 0.45);
}

.demo-btn {
    width: 100%;
    padding: 10px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px dashed rgba(255, 255, 255, 0.2);
    border-radius: 10px;
    color: #a5b4fc;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    margin-top: 12px;
    transition: all 0.2s ease;
}

.demo-btn:hover {
    background: rgba(99, 102, 241, 0.15);
    border-color: #6366f1;
}

.alert-box {
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
}

.alert-error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
}

.alert-success {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #86efac;
}

.spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: #fff;
    animation: spin 0.8s linear infinite;
    display: none;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 480px) {
    .auth-card {
        padding: 25px 20px;
    }
    .form-row {
        flex-direction: column;
        gap: 0;
    }
}
</style>
</head>
<body>

<div class="auth-card">
    <div class="brand-header">
        <div class="brand-icon">🧠</div>
        <h1>EduMind Pro</h1>
        <p id="subHeader">RAG-powered AI Study Companion</p>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" id="tabRegister" onclick="switchTab('register')">Create Profile</button>
        <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">Sign In</button>
    </div>

    <div id="alertBox" class="alert-box"></div>

    <form id="authForm" onsubmit="handleSubmit(event)">
        <!-- Register-only fields -->
        <div id="registerFields">
            <div class="form-row">
                <div class="input-box">
                    <label>Full Name *</label>
                    <input id="name" type="text" placeholder="e.g. Arjun Sharma">
                </div>
                <div class="input-box">
                    <label>Course *</label>
                    <input id="course" type="text" placeholder="e.g. B.Tech CS">
                </div>
            </div>

            <div class="form-row">
                <div class="input-box">
                    <label>Semester *</label>
                    <input id="semester" type="number" min="1" max="10" placeholder="e.g. 4">
                </div>
                <div class="input-box">
                    <label>Current CGPA *</label>
                    <input id="cgpa" type="text" placeholder="7.8">
                </div>
            </div>

            <div class="input-box full">
                <label>Target CGPA</label>
                <input id="target" type="text" placeholder="9.0">
            </div>

            <div class="input-box full">
                <label>Syllabus Subjects (comma-separated) *</label>
                <input id="subjects" type="text" placeholder="DBMS, OS, DCCN, COA, DSA">
            </div>

            <div class="form-row">
                <div class="input-box">
                    <label>Upcoming Exam Type</label>
                    <select id="examName">
                        <option value="Finals">Finals</option>
                        <option value="Midterm">Midterm</option>
                        <option value="Assessment">Assessment Exam</option>
                        <option value="Competitive">Competitive Exam</option>
                    </select>
                </div>
                <div class="input-box">
                    <label>Next Exam Date</label>
                    <input id="examDate" type="date">
                </div>
            </div>
        </div>

        <!-- Common credentials fields -->
        <div class="input-box full">
            <label>Email Address *</label>
            <input id="email" type="email" placeholder="student@example.com" required>
        </div>

        <div class="input-box full">
            <label>Password *</label>
            <input id="password" type="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">
            <span id="btnText">Start Learning →</span>
            <div class="spinner" id="spinner"></div>
        </button>

        <button type="button" class="demo-btn" onclick="fillDemoData()">⚡ Quick 1-Click Demo Login</button>
    </form>
</div>

<script>
let currentMode = 'register';

function switchTab(mode) {
    currentMode = mode;
    const isReg = mode === 'register';
    document.getElementById('tabRegister').classList.toggle('active', isReg);
    document.getElementById('tabLogin').classList.toggle('active', !isReg);
    document.getElementById('registerFields').style.display = isReg ? 'block' : 'none';
    document.getElementById('subHeader').innerText = isReg 
        ? 'One-time profile setup. Powered by RAG.' 
        : 'Welcome back! Sign in to continue.';
    document.getElementById('btnText').innerText = isReg ? 'Start Learning →' : 'Sign In to Dashboard →';
    hideAlert();
}

function showAlert(msg, isError = true) {
    const alertBox = document.getElementById('alertBox');
    alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
    alertBox.innerText = msg;
    alertBox.style.display = 'block';
}

function hideAlert() {
    document.getElementById('alertBox').style.display = 'none';
}

function fillDemoData() {
    document.getElementById('name').value = 'Arjun Sharma';
    document.getElementById('email').value = 'student@edumind.ai';
    document.getElementById('password').value = 'studyPass123!';
    document.getElementById('course').value = 'B.Tech CS';
    document.getElementById('semester').value = '4';
    document.getElementById('cgpa').value = '7.8';
    document.getElementById('target').value = '9.0';
    document.getElementById('subjects').value = 'DBMS, OS, DCCN, COA';
    document.getElementById('examName').value = 'Finals';
    
    // Set exam date 14 days from now
    const d = new Date();
    d.setDate(d.getDate() + 14);
    document.getElementById('examDate').value = d.toISOString().split('T')[0];

    showAlert("✨ Demo details filled! Click 'Start Learning' to proceed.", false);
}

async function handleSubmit(e) {
    e.preventDefault();
    hideAlert();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
        showAlert('Please provide both email and password.');
        return;
    }

    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const submitBtn = document.getElementById('submitBtn');

    spinner.style.display = 'inline-block';
    btnText.style.display = 'none';
    submitBtn.disabled = true;

    try {
        if (currentMode === 'register') {
            const name = document.getElementById('name').value.trim() || 'Student';
            const course = document.getElementById('course').value.trim() || 'B.Tech';
            const semester = document.getElementById('semester').value.trim() || '1';
            const cgpa = parseFloat(document.getElementById('cgpa').value) || 7.5;
            const targetCgpa = parseFloat(document.getElementById('target').value) || 9.0;
            const subjectsStr = document.getElementById('subjects').value.trim() || 'DBMS, OS, DCCN, COA';
            const subjects = subjectsStr.split(',').map(s => s.trim()).filter(Boolean);
            const examName = document.getElementById('examName').value || 'Finals';
            const examDate = document.getElementById('examDate').value || null;

            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name, email, password, course, semester, cgpa, targetCgpa, subjects, examName, examDate
                })
            });

            const data = await res.json();

            if (!res.ok) {
                // If already registered, automatically switch and attempt login
                if (res.status === 409) {
                    showAlert('Account already exists! Logging you in...', false);
                    return attemptLogin(email, password);
                }
                throw new Error(data.error || 'Failed to create profile');
            }

            saveUserData(data.token, data.user);
            showAlert('🎉 Profile created successfully! Redirecting...', false);
            setTimeout(() => { window.location.href = 'final.html'; }, 800);

        } else {
            await attemptLogin(email, password);
        }
    } catch (err) {
        showAlert(err.message || 'Network error occurred. Please try again.');
    } finally {
        spinner.style.display = 'none';
        btnText.style.display = 'inline-block';
        submitBtn.disabled = false;
    }
}

async function attemptLogin(email, password) {
    const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
    });

    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Invalid credentials');

    saveUserData(data.token, data.user);
    showAlert('✅ Login successful! Redirecting...', false);
    setTimeout(() => { window.location.href = 'final.html'; }, 800);
}

function saveUserData(token, user) {
    localStorage.setItem('token', token);
    localStorage.setItem('user', JSON.stringify(user));
    localStorage.setItem('username', user.name || 'User');
    localStorage.setItem('course', user.course || 'DBMS');
    localStorage.setItem('semester', user.semester || '1');
    localStorage.setItem('cgpa', user.cgpa || 'N/A');
    localStorage.setItem('targetCgpa', user.targetCgpa || '9.0');
    localStorage.setItem('examType', user.examName || 'Finals');
    localStorage.setItem('subjects', (user.subjects || []).join(', '));
}

// Prefill default exam date to 2 weeks out if empty
window.onload = () => {
    const d = new Date();
    d.setDate(d.getDate() + 14);
    const dateInput = document.getElementById('examDate');
    if (dateInput && !dateInput.value) {
        dateInput.value = d.toISOString().split('T')[0];
    }
};
</script>

</body>
</html>
